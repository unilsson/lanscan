[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanscan"
version = "0.1.0"
description = "A simple LAN discovery CLI based on arp-scan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
lanscan = "lanscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
