[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanscan"
version = "0.2.0"
description = "A LAN discovery CLI with ARP conflict detection and reverse DNS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
lanscan = "lanscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
